<span class="coin" aria-hidden="true">No. {{ number() }}</span>
<div>
  <h3 [id]="headingId()">{{ project().name }}</h3>
  <p>{{ project().description }}</p>
  <div class="links">
    @if (project().primary.href.startsWith('/')) {
      <a class="btn primary" [routerLink]="project().primary.href"
        ><msr-anchor-icon />{{ project().primary.label
        }}<span class="sr-only"> ({{ project().name }})</span></a
      >
    } @else {
      <a class="btn primary" [href]="project().primary.href"
        ><msr-anchor-icon />{{ project().primary.label
        }}<span class="sr-only"> ({{ project().name }})</span></a
      >
    }
    <a class="btn" [href]="project().sourceUrl"
      ><msr-code-icon />GitHub<span class="sr-only"> ({{ project().name }})</span></a
    >
  </div>
</div>
