<header class="poster">
  <p class="eyebrow">Open seas</p>
  <h1>Small, focused tools, built with care.</h1>
  <p class="lead">Captain's Chest is a home for open-source projects by CaptainDuckay.</p>
</header>
<section id="projects" aria-label="Projects">
  @defer (on viewport; hydrate on viewport) {
    @for (project of _projects; track project.slug) {
      <article cc-project-card [project]="project"></article>
    }
  } @placeholder (minimum 300ms) {
    <div class="grid-placeholder" aria-hidden="true"></div>
  } @loading (after 150ms; minimum 300ms) {
    <div class="grid-placeholder" aria-hidden="true"></div>
  }
</section>
