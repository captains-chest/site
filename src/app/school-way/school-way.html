<header>
  <p class="eyebrow"><a routerLink="/school">School</a> · The Way</p>
  <h1>Seven tenets of the Captain's Chest</h1>
  <p class="lead">Each tenet is drawn from what the skills actually say, and links back to the skills it comes from.</p>
</header>
<section aria-labelledby="tenet-list-heading">
  <h2 id="tenet-list-heading" class="sr-only">Tenets</h2>
  <ol class="stack plain-list">
    @for (tenet of tenets; track tenet.slug; let index = $index) {
      <li><article cc-tenet-card [tenet]="tenet" [number]="index + 1"></article></li>
    }
  </ol>
</section>
<p cc-school-credits></p>
