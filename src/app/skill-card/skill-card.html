<h3 [id]="headingId()">{{ title() }}</h3>
<p>{{ skill().purpose }}</p>
<div class="links">
  <a class="btn primary" [href]="path()">Read the skill<span class="sr-only"> {{ title() }}</span></a>
  <a class="btn" [href]="skill().sourceUrl">Source<span class="sr-only"> ({{ title() }})</span></a>
</div>
