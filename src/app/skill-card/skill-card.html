<h3 [id]="headingId()">{{ title() }}</h3>
<p>{{ skill().purpose }}</p>
<div class="links">
  <a class="btn primary" [routerLink]="path()"><msr-menu-book-icon />Read the skill<span class="sr-only"> {{ title() }}</span></a>
  <a class="btn" [href]="skill().sourceUrl"><msr-code-icon />Source<span class="sr-only"> ({{ title() }})</span></a>
</div>
